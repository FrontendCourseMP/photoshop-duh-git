<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photoshop Web</title>
  <link rel="stylesheet" href="reset.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
  <header class="top-bar">
    <button type="button" id="openBtn" aria-label="Открыть файл">
      <span class="icon-placeholder"></span>
      Открыть
    </button>
    <input type="file" id="fileInput" accept="image/png,image/jpeg,.gb7" hidden>
    <div class="export-wrap">
      <button type="button" id="exportBtn" aria-label="Экспортировать" aria-haspopup="menu" aria-expanded="false">
        <span class="icon-placeholder"></span>
        Экспорт
      </button>
      <div class="export-menu" id="exportMenu" role="menu" hidden>
        <button type="button" role="menuitem" data-format="png">PNG (.png)</button>
        <button type="button" role="menuitem" data-format="jpeg">JPEG (.jpg)</button>
        <button type="button" role="menuitem" data-format="gb7">GrayBit-7 (.gb7)</button>
      </div>
    </div>
    <div class="spacer"></div>
    <span class="project-title">photoshop-web / без названия</span>
  </header>

  <!-- ОСНОВНАЯ РАБОЧАЯ ОБЛАСТЬ -->
  <div class="main-workspace">
    <!-- ЛЕВАЯ ПАНЕЛЬ: ИНСТРУМЕНТЫ -->
    <aside class="left-tools">
      <div class="tool-item active" id="toolMove" data-tool="move" title="Перемещение (V)">✥</div>
      <!-- <div class="tool-item" title="Выделение (M)">⬚</div>
      <div class="tool-item" title="Лассо (L)">◌</div>
      <div class="tool-item" title="Волшебная палочка (W)">✨</div>
      <hr class="tool-separator"> -->
      <!-- <div class="tool-item" title="Кисть (B)">🖌</div>
      <div class="tool-item" title="Ластик (E)">⌫</div>
      <div class="tool-item" title="Заливка (G)">🪣</div>
      <div class="tool-item" title="Текст (T)">T</div>
      <hr class="tool-separator"> -->
      <div class="tool-item" id="toolEyedropper" data-tool="eyedropper" title="Пипетка (I)">
        <svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="512"
          height="512" x="0" y="0" viewBox="0 0 296.135 296.135" style="enable-background:new 0 0 512 512"
          xml:space="preserve" class="">
          <g>
            <path
              d="M284.5 11.635C276.997 4.132 267.021 0 256.411 0s-20.586 4.132-28.089 11.635l-64.681 64.68-6.658-6.658a18.87 18.87 0 0 0-11.59-5.466 19 19 0 0 0-5.438.26 18.9 18.9 0 0 0-9.786 5.206 18.95 18.95 0 0 0-4.165 6.273 19 19 0 0 0-1.389 7.134c0 1.213.116 2.426.347 3.621a18.86 18.86 0 0 0 5.206 9.786l4.319 4.319L21.468 213.811a15 15 0 0 0-3.316 5.025l-16.19 40.387c-3.326 8.298-2.338 17.648 2.644 25.013 5.04 7.451 13.356 11.899 22.244 11.899a26.9 26.9 0 0 0 10.063-1.961l40.387-16.19a15 15 0 0 0 5.025-3.316l113.021-113.021 4.318 4.318q.695.694 1.44 1.302c.993.81 2.049 1.504 3.15 2.083a18.96 18.96 0 0 0 8.818 2.169q.044-.002.087-.004a19 19 0 0 0 5.312-.777 18.84 18.84 0 0 0 8.009-4.773 18.87 18.87 0 0 0 4.772-8.009 19.04 19.04 0 0 0 0-10.797 18.87 18.87 0 0 0-4.772-8.009l-6.658-6.658 64.68-64.68c15.486-15.486 15.486-40.688-.002-56.177M63.285 251.282l-30.764 12.331 12.332-30.763 110.848-110.848 18.432 18.432z"
              fill="#e0e0e0" opacity="1" data-original="#000000" class=""></path>
          </g>
        </svg>
      </div>
      <!-- <div class="tool-item" title="Штамп (S)">⎘</div>
      <div class="tool-item" title="Резкость/Размытие (R)">◐</div>
      <hr class="tool-separator"> -->
      <!-- <div class="tool-item" title="Масштаб (Z)">🔍</div>
      <div class="tool-item" title="Рука (H)">✋</div> -->
    </aside>

    <!-- ЦЕНТР: ХОЛСТ -->
    <main class="canvas-area">
      <div class="canvas-container" id="canvasContainer">
        <canvas id="mainCanvas" width="800" height="600"></canvas>
      </div>
    </main>

    <!-- ПРАВАЯ ПАНЕЛЬ: МАСКИ И СЛОИ -->
    <aside class="right-panel">
      <!-- Секция масок -->
      <div class="panel-section">
        <div class="panel-header">
          <span>Маски</span>
        </div>
        <div class="mask-controls">
          <label class="mask-toggle" id="maskToggleLabel">
            <input type="checkbox" id="maskToggle" checked disabled>
            <span class="mask-toggle__box"></span>
            <span class="mask-toggle__text">Показывать маску</span>
          </label>
          <div class="mask-hint" id="maskHint">Маска отсутствует</div>
        </div>
      </div>

      <!-- Секция каналов -->
      <div class="panel-section">
        <div class="panel-header">
          <span>Каналы</span>
          <span class="badge" id="channelsCount">0</span>
        </div>
        <div class="channel-list" id="channelList">
          <!-- элементы генерируются из JS -->
        </div>
      </div>
    </aside>
  </div>

  <!-- ФУТЕР -->
  <footer class="footer">
    <div class="footer-left">
      <span><span class="status-dot status-dot--ok"></span><span id="statusText">Готово</span></span>
      <span class="separator"></span>
      <span id="statusSize">— × — px</span>
      <span class="separator"></span>
      <span id="statusColor">—</span>
    </div>
    <div class="footer-right">
      <div class="zoom-control">
        <button type="button" id="zoomOutBtn" aria-label="Уменьшить">−</button>
        <button type="button" id="zoomLabel" title="Показать 100%"
          style="font-size: 11px; min-width: 44px; text-align: center; cursor: pointer;">100%</button>
        <button type="button" id="zoomInBtn" aria-label="Увеличить">+</button>
      </div>
      <span class="separator"></span>
      <span>© photoshop-web</span>
    </div>
  </footer>
  <script type="module" src="src/main.js"></script>
</body>

</html>
